edition = "2024";

package starlark.ast;

import "proto/starlark_logging.proto";

message File {
  repeated Statement statement = 1;
  repeated string module_binding = 2;
  repeated string file_binding = 3;
  repeated string global_binding = 4;
  PositionInFile pif = 5;
}

message Statement {
  oneof statement_type {
    DefStmt def_statement = 1;
    IfStmt if_statement = 2;
    ForStmt for_statement = 3;
    ReturnStmt return_statement = 4;
    BreakStmt break_statement = 5;
    ContinueStmt continue_statement = 6;
    PassStmt pass_statement = 7;
    AssignStmt assign_statement = 8;
    Expression expression_statement = 9;
    LoadStmt load_statement = 10;
  }
  PositionInFile pif = 11;
}

message DefStmt {
  Identifier function_name = 1;
  repeated Parameter parameter = 2;
  repeated Statement statement = 3;
  repeated string function_binding = 4;
  PositionInFile pif = 5;
}

message Parameter {
  Identifier identifier = 1;
  oneof parameter_type {
    Expression initialization = 2;
    Star star = 3;
    StarStar star_star = 4;
  }
  PositionInFile pif = 5;
}

message Star {
  PositionInFile pif = 1;
}

message StarStar {
  PositionInFile pif = 1;
}

message IfStmt {
  Expression test = 1;
  repeated Statement statement = 2;
  repeated ElseIf elif = 3;
  repeated Statement else_statement = 4;
  PositionInFile pif = 5;
}

message ElseIf {
  Expression test = 1;
  repeated Statement statement = 2;
  PositionInFile pif = 3;
}

message ForStmt {
  Expression loop_variables = 1;
  Expression expression = 2;
  repeated Statement statement = 3;
  PositionInFile pif = 4;
}

message ReturnStmt {
  Expression expression = 1;
  PositionInFile pif = 2;
}

message BreakStmt {
  PositionInFile pif = 1;
}

message ContinueStmt {
  PositionInFile pif = 1;
}

message PassStmt {
  PositionInFile pif = 1;
}

message AssignStmt {
  Expression lhs = 1;
  AssignOperator op = 2;
  Expression rhs = 3;

  enum AssignOperator {
    UNKNOWN = 0;
    EQUALS = 1;
    PLUS_EQUALS = 2;
    MINUS_EQUALS = 3;
    STAR_EQUALS = 4;
    SLASH_EQUALS = 5;
    SLASH_SLASH_EQUALS = 6;
    PERCENT_EQUALS = 7;
    AMPERSAND_EQUALS = 8;
    PIPE_EQUALS = 9;
    HAT_EQUALS = 10;
    LESS_LESS_EQUALS = 11;
    GREATER_GREATER_EQUALS = 12;
  }
  PositionInFile pif = 4;
  PositionInFile op_pif = 5;
}

message LoadStmt {
  string module = 1;
  repeated LoadParams load_param = 2;
  PositionInFile pif = 3;
}

message LoadParams {
  Identifier local_name = 1;
  string remote_name = 2;
  PositionInFile pif = 3;
}

message IfExpr {
  Expression if_value = 1;
  Expression if_test = 2;
  Expression else_value = 3;
  PositionInFile pif = 4;
}

message UnaryExpr {
  UnaryOperator operator = 1;
  Expression test = 2;

  enum UnaryOperator {
    UNNKNOWN = 0;
    PLUS = 1;
    MINUS = 2;
    TILDE = 3;
    NOT = 4;
  }
  PositionInFile pif = 3;
  PositionInFile op_pif = 4;
}

message BinaryExpr {
  Expression lhs = 1;
  BinaryOperator operator = 2;
  Expression rhs = 3;

  enum BinaryOperator {
    UNKNOWN = 0;
    OR = 1;
    AND = 2;
    EQUALS_EQUALS = 3;
    BANG_EQUALS = 4;
    LESS_THAN = 5;
    GREATER_THAN = 6;
    LESS_THAN_EQUALS = 7;
    GREATER_THAN_EQUALS = 8;
    IN = 9;
    NOT_IN = 10;
    PIPE = 11;
    HAT = 12;
    AMPERSAND = 13;
    LESS_THAN_LESS_THAN = 14;
    GREATER_THAN_GREATER_THAN = 15;
    MINUS = 16;
    PLUS = 17;
    STAR = 18;
    PERCENT = 19;
    SLASH = 20;
    SLASH_SLASH = 21;
  }
  PositionInFile pif = 4;
  PositionInFile op_pif = 5;
}

message LambdaExpr {
  repeated Parameter parameter = 1;
  Expression test = 2;
  repeated string function_binding = 3;
  PositionInFile pif = 4;
}

message Expression {
  // Next_ID: 20
  oneof expression_type {
    DotExpr dot_expression = 1;
    CallExpr call_expression = 2;
    SliceExpr slice_expression = 3;
    Identifier identifier = 4;
    IntValue int_value = 18;
    StringValue big_int_value = 5;
    FloatValue float_value = 6;
    StringValue string_value = 7;
    StringValue bytes_value = 8;
    ListExpr list_expression = 9;
    ListComp list_comprehension = 10;
    DictExpr dictionary_expression = 11;
    DictComp dictionary_comprehension = 12;
    IfExpr if_expression = 13;
    UnaryExpr unary_expression = 14;
    BinaryExpr binary_expression = 15;
    LambdaExpr lambda_expression  = 16;
    Tuple tuple = 17;
  }
  PositionInFile pif = 19;
}

message StringValue {
  string value = 1;
  PositionInFile pif = 2;
}

message IntValue {
  int64 value = 1;
  PositionInFile pif = 2;
}

message FloatValue {
  double value = 1;
  PositionInFile pif = 2;
}

message ListExpr {
  repeated Expression element = 1;
  PositionInFile pif = 2;
}

message ListComp {
  Expression test = 1;
  repeated CompClause clause = 2;
  repeated string comprehension_binding = 3;
  PositionInFile pif = 4;
}

message DictExpr {
  repeated Entry entry = 1;
  PositionInFile pif = 2;
}

message DictComp {
  Entry entry = 1;
  repeated CompClause clause = 2;
  repeated string comprehension_binding = 3;
  PositionInFile pif = 4;
}

message CompClause {
  oneof comp_clause_type {
    ForClause for_clause = 1;
    IfClause if_clause = 2;
  }
  PositionInFile pif = 3;
}

message ForClause {
  Expression loop_variables = 1;
  Expression in = 2;
  PositionInFile pif = 3;
}

message IfClause {
  Expression test = 1;
  PositionInFile pif = 2;
}

message Entry {
  Expression key = 1;
  Expression value = 2;
  PositionInFile pif = 3;
}

message DotExpr {
  Expression primary_expression = 1;
  Identifier identifier = 2;
  PositionInFile pif = 3;
}

message CallExpr {
  Expression primary_expression = 1;
  repeated Argument argument = 2;
  PositionInFile pif = 3;
}

message Argument {
  oneof argument_type {
    Expression value = 1;
    NamedArgument named_argument = 2;
    Expression star_argument = 3;
    Expression star_star_argument = 4;
  }
  PositionInFile pif = 5;
}

message NamedArgument {
  Identifier identifier = 1;
  Expression value = 2;
  PositionInFile pif = 3;
}

message SliceExpr {
  Expression primary_expression = 1;
  oneof slice_type {
    Expression index = 2;
    Slice slice = 3;
  }
  PositionInFile pif = 4;
}

// The spec states that it is possible to have a slice that `start` is
// of type `Expression`, but it is unclear how that would work.
// https://github.com/bazelbuild/starlark/issues/291
message Slice {
  Expression start = 1;
  Expression end = 2;
  Expression step = 3;
  PositionInFile pif = 4;
}

message Tuple {
  repeated Expression value = 1;
  PositionInFile pif = 2;
}

message Identifier {
  string name = 1;
  string nfkc_name = 2;
  int64 frame = 3;
  int64 pos_in_frame = 4;
  PositionInFile pif = 5;
}

message PositionInFile {
  starlark.logging.Position start = 1;
  starlark.logging.Position end = 2;
}
