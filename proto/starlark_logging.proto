edition = "2024";

package starlark.logging;

enum LogLevel {
  LOG_LEVEL_UNKNOWN = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARNING = 3;
  LOG_LEVEL_ERROR = 4;
  LOG_LEVEL_FATAL = 5;
  LOG_LEVEL_NONE = 6;
}

message Position {
  uint64 row = 1;
  uint64 column = 2;
  uint64 pos = 3;
}

message PositionInFile {
  Position start = 1;
  Position end = 2;
}

message LogEntry {
  LogLevel level = 1;
  string module = 2;
  string message = 3;
  Position pos = 4;
}

