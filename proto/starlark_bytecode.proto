edition = "2024";

package starlark.bytecode;

message Program {
  repeated Block block = 1;
}

message Block {
  repeated OpCode op_code = 1;
  oneof symbols {
    FunctionSignature function_signature = 2;
    SymbolsTable exportable_symbols = 3;
  }
}

message OpCode {
  // next_id: 72
  oneof op_code {
    // There are no op codes for `True` and `False` as they are not reserved words.
    // https://github.com/bazelbuild/starlark/issues/312
    ConstBigInt const_big_int = 1;
    ConstInt const_int = 67;
    ConstFloat const_float = 2;
    ConstString const_string = 3;
    ConstBytes const_bytes = 4;
    ConstNone const_none = 59;

    Pop pop = 5;

    UnaryPlus unary_plus = 7;
    UnaryMinus unary_minus = 8;
    UnaryTilde unary_tilde = 9;
    UnaryNot unary_not = 10;

    BinaryEqualsEquals binary_equals_equals = 11;
    BinaryBangEquals binary_bang_equals = 12;
    BinaryLessThan binary_less_than = 13;
    BinaryGreateThan binary_greater_than = 14;
    BinaryLessThanEquals binary_less_than_equals = 15;
    BinaryGreaterThanEquals binary_greater_than_equals = 16;
    BinaryIn binary_in = 17;
    BinaryNotIn binary_not_in = 18;
    BinaryPipe binary_pipe = 19;
    BinaryHat binary_hat = 20;
    BinaryAmpersand binary_ampersand = 21;
    BinaryLessThanLessThan binary_less_than_less_than = 22;
    BinaryGreaterThanGreaterThan binary_greater_than_greater_than = 23;
    BinaryMinus binary_minus = 24;
    BinaryPlus binary_plus = 25;
    BinaryStar binary_star = 26;
    BinaryPercent binary_percent = 27;
    BinarySlash binary_slash = 28;
    BinarySlashSlash binary_slash_slash = 29;

    JumpAddress goto = 30;
    JumpAddress jump_if_false = 32;
    JumpAddress jump_if_true_or_pop = 31;
    JumpAddress jump_if_false_or_pop = 6;

    MakeTuple make_tuple = 33;
    MakeList make_list = 34;
    AddToList add_to_list = 35;
    MakeDictionary make_dictionary = 36;
    AddToDictionary add_to_dictionary = 37;

    PosInFrame load = 38;
    PosInFrame store = 39;

    GetIterator get_iterator = 40;
    ForIterator for_iterator = 41;
    EndIterator end_iterator = 42;

    Unpack unpack = 70;
    DotMember assign_dot_member = 43;
    IndexMember assign_index_member = 68;
    SliceRange assign_slice_range = 69;
    Assign plus_assign= 44;
    Assign minus_assign = 45;
    Assign star_assign = 46;
    Assign slash_assign = 47;
    Assign slash_slash_assign = 48;
    Assign percent_assign = 49;
    Assign ampersand_assign = 50;
    Assign pipe_assign = 51;
    Assign hat_assign = 52;
    Assign less_less_assign = 53;
    Assign greater_greater_assign = 54;


    DotMember dot_member = 55;
    IndexMember index_member = 60;
    SliceRange slice_range = 61;
    Call call = 56;
    LoadModule load_module = 57;
    Return return = 62;

    MakeFunction make_function = 63;
    SetDefaultValues set_default_values = 64;

    CreateFrame create_frame = 65;
    PopFrame pop_frame = 66;

    End end = 58;
    Fail fail = 71;
  }
}

message ConstNone {}

message ConstInt {
  int64 value = 1;
}

message ConstBigInt {
  string value = 1;
}

message ConstFloat {
  double value = 1;
}

message ConstString {
  string value = 1;
}

message ConstBytes {
  string value = 1;
}

message Pop {}
message UnaryPlus {}
message UnaryMinus {}
message UnaryTilde {}
message UnaryNot {}
message BinaryEqualsEquals {}
message BinaryBangEquals {}
message BinaryLessThan {}
message BinaryGreateThan {}
message BinaryLessThanEquals {}
message BinaryGreaterThanEquals {}
message BinaryIn {}
message BinaryNotIn {}
message BinaryPipe {}
message BinaryHat {}
message BinaryAmpersand {}
message BinaryLessThanLessThan {}
message BinaryGreaterThanGreaterThan {}
message BinaryMinus {}
message BinaryPlus {}
message BinaryStar {}
message BinaryPercent {}
message BinarySlash {}
message BinarySlashSlash {}

message JumpAddress {
  uint32 address = 1;
}

message MakeTuple {
  uint32 number_of_elements = 1;
}

message MakeList {
  uint32 reserve_size = 1;
}
message AddToList {
  uint32 pos_in_stack = 1;
  uint32 number_of_elements = 2;
}

message MakeDictionary {
  uint32 reserve_size = 1;
}
message AddToDictionary {
  uint32 pos_in_stack = 1;
  uint32 number_of_elements = 2;
}

message PosInFrame {
  int64 frame = 1;
  int64 pos_in_frame = 2;
}

message GetIterator {}
message ForIterator {
  uint32 address = 1;
}
message EndIterator {}

message Unpack {
  uint32 number_of_elements = 1;
}

message Assign {}

message DotMember {
  string member = 1;
}

message IndexMember {}
message SliceRange{}

message Call {
  int32 positional_arguments_count = 1;
  int32 named_arguments_count = 2;
  bool has_varadic_positional_argument = 3;
  bool has_varadic_named_argument = 4;
}

message LoadModule {
  string module = 1;
  repeated Value value = 2;
  message Value {
    string remote_symbol = 1;
    PosInFrame pos = 2;
  }
}

message Return {}

message MakeFunction {
  uint32 entrypoint = 1;
}

message SetDefaultValues {}

message CreateFrame {
  uint32 slots = 1;
}

message PopFrame {}

message End {}
message Fail {}

message FunctionSignature {
  repeated Param param = 1;
  uint64 default_arguments_count = 2;
  bool has_star_argument = 3;
  bool has_star_star_argument = 4;
  message Param {
    string name = 1;
    PosInFrame pos = 2;
  }
}

message SymbolsTable {
  repeated string symbol = 1;
}
